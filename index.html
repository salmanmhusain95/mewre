<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>منظومة الرصد الإعلامي</title>
<meta name="description" content="منظومة الرصد الإعلامي — وزارة الكهرباء والماء والطاقة المتجددة">

<!-- ===== الرابط الوحيد الذي قد تحتاج تغييره: رابط منظومتك المنتهي بـ /exec ===== -->
<!-- للعرض بدون تسجيل دخول (قراءة فقط) استبدله برابط الشاشة المنتهي بـ ?screen=... -->
<meta name="app-url" content="https://script.google.com/macros/s/AKfycbyBTe3i9a7HfzrZuMeFePODBUF1NLWcNaf1ne0TpK4kMl1PLOZrRR20ml7mF7Db0nSZBw/exec">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D2668">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الرصد الإعلامي">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0D2668;overflow:hidden;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(120% 120% at 50% 30%,#1B3A86 0,#0D2668 60%,#071645 100%);color:#fff;
    padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:min(42vw,180px);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
  #splash h1{margin:0;font-size:clamp(18px,5vw,26px);font-weight:800;letter-spacing:.2px;text-align:center}
  #splash p{margin:0;font-size:13px;color:rgba(255,255,255,.7);text-align:center}
  .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#95CDB2,#24B7C5,#2D76B1,#3B569F)}
</style>
</head>
<body>
<div id="splash">
  <div class="bar"></div>
  <img src="icon-512.png" alt="وزارة الكهرباء والماء والطاقة المتجددة">
  <h1>منظومة الرصد الإعلامي</h1>
  <div class="ring"></div>
  <p>جارٍ فتح المنظومة…</p>
</div>
<iframe id="frame" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  var APP = document.querySelector('meta[name="app-url"]').content;
  var f = document.getElementById('frame'), sp = document.getElementById('splash');
  f.src = APP;
  var done = false;
  function hide(){ if (done) return; done = true; sp.classList.add('hide'); setTimeout(function(){ sp.style.display='none'; }, 600); }
  f.addEventListener('load', hide);
  setTimeout(hide, 9000);
  if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
