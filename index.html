<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة الرصد الإعلامي</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D2668">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الرصد الإعلامي">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:100vh;
    background:radial-gradient(120% 120% at 50% 30%,#1B3A86 0,#0D2668 60%,#071645 100%);color:#fff;text-align:center;
    padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom))}
  .bar{position:fixed;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#95CDB2,#24B7C5,#2D76B1,#3B569F)}
  img{width:min(44vw,190px);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
  h1{margin:0;font-size:clamp(19px,5.4vw,27px);font-weight:800}
  .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a.btn{background:#fff;color:#0D2668;font-weight:800;font-size:16px;text-decoration:none;padding:13px 30px;border-radius:12px}
</style>
</head>
<body>
<div class="bar"></div>
<img src="icon-512.png" alt="وزارة الكهرباء والماء والطاقة المتجددة">
<h1>منظومة الرصد الإعلامي</h1>
<div class="ring"></div>
<a class="btn" id="go" href="#">ادخل إلى المنظومة</a>
<script>
  var APP = "https://script.google.com/macros/s/AKfycbyBTe3i9a7HfzrZuMeFePODBUF1NLWcNaf1ne0TpK4kMl1PLOZrRR20ml7mF7Db0nSZBw/exec";
  document.getElementById('go').href = APP;
  // remove any old cached service worker that may serve a stale page
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } catch(e){}
  try { if (window.caches && caches.keys) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } catch(e){}
  setTimeout(function(){ window.location.href = APP; }, 1100);
</script>
</body>
</html>
